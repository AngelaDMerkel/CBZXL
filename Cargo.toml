[package]
name = "cbzxl"
version = "5.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
blake3 = "1"
blake2 = "0.10"
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
flate2 = "1"
hex = "0.4"
mime_guess = "2"
liblzma = "0.4"
oem_cp = "2.1"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["bzip2", "deflate", "deflate-flate2-zlib-rs", "lzma", "time"] }

[dev-dependencies]
pretty_assertions = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
